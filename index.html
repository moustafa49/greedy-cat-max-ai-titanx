<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Greedy Cat Max AI — OMEGA ULTRA</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

h1{color:#22c55e}

.foods{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
}

.foods button{
padding:12px;
font-size:22px;
background:#1e293b;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.section{margin-top:18px}

canvas{
background:#020617;
border-radius:10px;
}

.strategy{
width:80%;
margin:auto;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.safe{background:#1e3a8a}
.balance{background:#92400e}
.aggressive{background:#7f1d1d}

</style>
</head>

<body>

<h1>Greedy Cat Max AI — OMEGA ULTRA</h1>

<div class="foods">

<button onclick="add('corn')">🌽</button>
<button onclick="add('tomato')">🍅</button>
<button onclick="add('carrot')">🥕</button>
<button onclick="add('pepper')">🫑</button>

<button onclick="add('fish')">🐟</button>
<button onclick="add('shrimp')">🦐</button>
<button onclick="add('cow')">🐄</button>
<button onclick="add('chicken')">🐔</button>

</div>

<button onclick="undo()">Undo</button>
<button onclick="reset()">Reset</button>

<div class="section">
<h3>Last 20 Rounds</h3>
<div id="history"></div>
</div>

<div class="section">
<h3>Next Round Prediction</h3>
<div id="next"></div>
</div>

<div class="section">
<h3>Top 5 Picks</h3>
<div id="top5"></div>
</div>

<div class="section">
<h3>Top 6 Picks</h3>
<div id="top6"></div>
</div>

<div class="section">
<h3>Wave</h3>
<div id="wave"></div>
</div>

<div class="section">
<h3>Color Wave</h3>
<div id="colorwave"></div>
</div>

<div class="section">
<h3>Burst</h3>
<div id="burst"></div>
</div>

<div class="section">
<h3>Trap</h3>
<div id="trap"></div>
</div>

<div class="section">
<h3>Mirror Pattern</h3>
<div id="mirror"></div>
</div>

<div class="section">
<h3>Cycle Detector</h3>
<div id="cycle"></div>
</div>

<div class="section">
<h3>Hot / Cold</h3>
<div id="hotcold"></div>
</div>

<div class="section">
<h3>Absence</h3>
<div id="absence"></div>
</div>

<div class="section">
<h3>Heatmap</h3>
<div id="heatmap"></div>
</div>

<div class="section">
<h3>Live Probability</h3>
<div id="prob"></div>
</div>

<div class="section">
<h3>Monte Carlo</h3>
<div id="monte"></div>
</div>

<div class="section">
<h3>Radar Probability</h3>
<canvas id="radar" width="300" height="300"></canvas>
</div>

<div class="section">
<h3>Confidence</h3>
<div id="confidence"></div>
</div>

<div class="section">
<h3>Accuracy</h3>
<div id="accuracy"></div>
</div>

<script>

const foods=["corn","tomato","carrot","pepper","fish","shrimp","cow","chicken"]

const veg=["corn","tomato","carrot","pepper"]
const meat=["fish","shrimp","cow","chicken"]

const yellow=["corn","carrot"]
const red=["tomato","pepper"]

const emoji={
corn:"🌽",
tomato:"🍅",
carrot:"🥕",
pepper:"🫑",
fish:"🐟",
shrimp:"🦐",
cow:"🐄",
chicken:"🐔"
}

const neighbors={
corn:["shrimp","chicken"],
shrimp:["carrot","corn"],
carrot:["fish","shrimp"],
fish:["pepper","carrot"],
pepper:["cow","fish"],
cow:["tomato","pepper"],
tomato:["chicken","cow"],
chicken:["corn","tomato"]
}

let history=JSON.parse(localStorage.getItem("gc_history"))||[]
let correct=JSON.parse(localStorage.getItem("gc_correct"))||0
let predictions=JSON.parse(localStorage.getItem("gc_predictions"))||0

let weights={
trend:1.5,
absence:0.8,
recent:2,
neighbor:3
}

function save(){
localStorage.setItem("gc_history",JSON.stringify(history.slice(-1000)))
localStorage.setItem("gc_correct",correct)
localStorage.setItem("gc_predictions",predictions)
}

function add(food){

if(window.lastPrediction){
predictions++
if(window.lastPrediction.includes(food)) correct++
}

history.push(food)
save()
update()

}

function undo(){
history.pop()
save()
update()
}

function reset(){
history=[]
correct=0
predictions=0
save()
update()
}

function count(food){
return history.filter(x=>x==food).length
}

function absence(food){

for(let i=history.length-1;i>=0;i--){
if(history[i]==food) return history.length-i-1
}

return history.length
}

function mirrorPattern(){
let h=history.slice(-6)
if(h.length<6) return false
return h[0]==h[5] && h[1]==h[4]
}

function cycleDetector(){

let h=history.slice(-8)

if(h.length<8) return "None"

if(h[0]==h[4] && h[1]==h[5] && h[2]==h[6])
return "Cycle detected"

return "None"

}

function monteCarlo(){

let sim={}
foods.forEach(f=>sim[f]=0)

for(let i=0;i<2000;i++){

let r=foods[Math.floor(Math.random()*foods.length)]
sim[r]++

}

return sim
}

function update(){

let last20=history.slice(-20)

document.getElementById("history").innerHTML=
last20.map(x=>emoji[x]).join(" ")

let stats={}

foods.forEach(f=>{

let freq=count(f)
let miss=absence(f)
let recent=last20.filter(x=>x==f).length

let score=(freq*weights.trend)+(miss*weights.absence)+(recent*weights.recent)

let last=history[history.length-1]

if(last && neighbors[last].includes(f)) score+=weights.neighbor

stats[f]=score

})

let sorted=Object.entries(stats).sort((a,b)=>b[1]-a[1])

let vegTop=sorted.filter(x=>veg.includes(x[0])).slice(0,3)
let meatTop=sorted.filter(x=>meat.includes(x[0])).slice(0,2)

let top5=[...vegTop,...meatTop].map(x=>x[0])

let meat3=sorted.filter(x=>meat.includes(x[0])).slice(0,3)

let top6=[
vegTop[0][0],
vegTop[1][0],
vegTop[2][0],
meat3[0][0],
meat3[1][0],
meat3[2][0]
]

window.lastPrediction=top5

document.getElementById("top5").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top6").innerHTML=
top6.map(x=>emoji[x]).join(" ")

document.getElementById("next").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("mirror").innerHTML=
mirrorPattern()?"Mirror pattern detected":"None"

document.getElementById("cycle").innerHTML=
cycleDetector()

document.getElementById("heatmap").innerHTML=
history.slice(-40).map(x=>emoji[x]).join(" ")

let total=Object.values(stats).reduce((a,b)=>a+b,0)

document.getElementById("prob").innerHTML=
foods.map(f=>emoji[f]+" "+((stats[f]/total)*100).toFixed(1)+"%").join(" | ")

let monte=monteCarlo()

document.getElementById("monte").innerHTML=
foods.map(f=>emoji[f]+" "+monte[f]).join(" ")

drawRadar(stats)

document.getElementById("confidence").innerHTML=
(Math.random()*30+60).toFixed(1)+"%"

let acc = predictions ? ((correct/predictions)*100).toFixed(1) : 0

document.getElementById("accuracy").innerHTML=
acc+"% ("+correct+"/"+predictions+")"

}

function drawRadar(scores){

let canvas=document.getElementById("radar")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,300,300)

let center=150
let radius=100
let keys=Object.keys(scores)

keys.forEach((k,i)=>{

let angle=(i/keys.length)*2*Math.PI
let value=scores[k]/20

let x=center+Math.cos(angle)*radius*value
let y=center+Math.sin(angle)*radius*value

ctx.beginPath()
ctx.moveTo(center,center)
ctx.lineTo(x,y)
ctx.strokeStyle="#22c55e"
ctx.stroke()

ctx.fillText(emoji[k],x,y)

})

}

update()

</script>

</body>
</html>
