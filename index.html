<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Greedy Cat Max AI – TITAN ELITE</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

h1{color:#22c55e}

.foods{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:12px;
}

.foods button{
padding:12px;
font-size:22px;
background:#1e293b;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.foods button:hover{
background:#334155;
}

.section{
margin-top:18px;
}

.bar{
height:8px;
background:#22c55e;
margin:3px auto;
width:80%;
border-radius:4px;
}
</style>
</head>

<body>

<h1>Greedy Cat Max AI – TITAN ELITE</h1>

<div class="foods">
<button onclick="add('corn')">🌽</button>
<button onclick="add('tomato')">🍅</button>
<button onclick="add('carrot')">🥕</button>
<button onclick="add('pepper')">🌶</button>

<button onclick="add('fish')">🐟</button>
<button onclick="add('shrimp')">🦐</button>
<button onclick="add('cow')">🐄</button>
<button onclick="add('chicken')">🐔</button>
</div>

<button onclick="undo()">Undo</button>
<button onclick="reset()">Reset</button>

<div class="section">
<h3>Last 20 Rounds</h3>
<div id="history"></div>
</div>

<div class="section">
<h3>Suggested Bet</h3>
<div id="bet"></div>
</div>

<div class="section">
<h3>Top 5 Picks</h3>
<div id="top5"></div>
</div>

<div class="section">
<h3>Top 6 Picks</h3>
<div id="top6"></div>
</div>

<div class="section">
<h3>Confidence</h3>
<div id="confidence"></div>
</div>

<div class="section">
<h3>Wave Detector</h3>
<div id="wave"></div>
</div>

<div class="section">
<h3>Color Flow</h3>
<div id="color"></div>
</div>

<div class="section">
<h3>Burst Detector</h3>
<div id="burst"></div>
</div>

<div class="section">
<h3>Trap Detector</h3>
<div id="trap"></div>
</div>

<div class="section">
<h3>Hot / Cold</h3>
<div id="hotcold"></div>
</div>

<div class="section">
<h3>Absence</h3>
<div id="absence"></div>
</div>

<div class="section">
<h3>Monte Carlo</h3>
<div id="monte"></div>
</div>

<div class="section">
<h3>Radar</h3>
<canvas id="radar" width="250" height="250"></canvas>
</div>

<div class="section">
<h3>AI Accuracy</h3>
<div id="accuracy"></div>
</div>

<script>

const foods=["corn","tomato","carrot","pepper","fish","shrimp","cow","chicken"]

const veg=["corn","tomato","carrot","pepper"]
const meat=["fish","shrimp","cow","chicken"]

const yellow=["corn","carrot"]
const red=["tomato","pepper"]

const emoji={
corn:"🌽",
tomato:"🍅",
carrot:"🥕",
pepper:"🌶",
fish:"🐟",
shrimp:"🦐",
cow:"🐄",
chicken:"🐔"
}

let history=JSON.parse(localStorage.getItem("gc_history"))||[]
let correct=JSON.parse(localStorage.getItem("gc_correct"))||0
let predictions=JSON.parse(localStorage.getItem("gc_predictions"))||0

/* adaptive learning weights */

let weights=JSON.parse(localStorage.getItem("gc_weights"))||{
trend:3,
momentum:2,
absence:1,
sequence:1
}

/* sequence memory */

let memory=JSON.parse(localStorage.getItem("gc_memory"))||{}

function save(){
localStorage.setItem("gc_history",JSON.stringify(history.slice(-600)))
localStorage.setItem("gc_correct",correct)
localStorage.setItem("gc_predictions",predictions)
localStorage.setItem("gc_weights",JSON.stringify(weights))
localStorage.setItem("gc_memory",JSON.stringify(memory))
}

function add(food){

let last=history[history.length-1]

/* sequence memory */

if(last){
if(!memory[last]) memory[last]={}
if(!memory[last][food]) memory[last][food]=0
memory[last][food]++
}

/* adaptive learning */

if(window.lastPrediction){

predictions++

if(window.lastPrediction.includes(food)){
correct++
weights.trend+=0.05
weights.momentum+=0.03
}else{
weights.absence+=0.05
weights.sequence+=0.02
}

}

history.push(food)

save()

update()
}

function undo(){
history.pop()
save()
update()
}

function reset(){
history=[]
correct=0
predictions=0
weights={trend:3,momentum:2,absence:1,sequence:1}
memory={}
save()
update()
}

function count(f){
return history.filter(x=>x==f).length
}

function absence(f){
for(let i=history.length-1;i>=0;i--){
if(history[i]==f) return history.length-i-1
}
return history.length
}

function update(){

let last20=history.slice(-20)

document.getElementById("history").innerHTML=
last20.map(x=>emoji[x]).join(" ")

let scores={}

foods.forEach(f=>{

let freq=count(f)
let miss=absence(f)
let recent=last20.filter(x=>x==f).length

let seqBoost=0
let last=history[history.length-1]

if(last && memory[last] && memory[last][f]){
seqBoost=memory[last][f]
}

scores[f]=
recent*weights.trend +
freq*weights.momentum +
miss*weights.absence +
seqBoost*weights.sequence +
Math.random()*2

})

let sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1])

let picks=sorted.slice(0,5).map(x=>x[0])
let picks6=sorted.slice(0,6).map(x=>x[0])

window.lastPrediction=picks

document.getElementById("bet").innerHTML=
picks.map(x=>emoji[x]).join(" ")

document.getElementById("top5").innerHTML=
picks.map(x=>emoji[x]).join(" ")

document.getElementById("top6").innerHTML=
picks6.map(x=>emoji[x]).join(" ")

let vegCount=last20.filter(x=>veg.includes(x)).length
let meatCount=last20.filter(x=>meat.includes(x)).length

document.getElementById("wave").innerHTML=
vegCount>meatCount?"Vegetable wave":"Meat wave"

let yCount=last20.filter(x=>yellow.includes(x)).length
let rCount=last20.filter(x=>red.includes(x)).length

document.getElementById("color").innerHTML=
yCount>rCount?"Yellow flow":"Red flow"

let burst=foods.filter(f=>last20.slice(-3).filter(x=>x==f).length>=2)

document.getElementById("burst").innerHTML=
burst.length?burst.map(x=>emoji[x]).join(" ")+" burst":"none"

let trap=last20.slice(-4).every(x=>veg.includes(x))

document.getElementById("trap").innerHTML=
trap?"animal break risk":"no trap"

let hot=sorted.slice(0,2).map(x=>emoji[x[0]])
let cold=sorted.slice(-2).map(x=>emoji[x[0]])

document.getElementById("hotcold").innerHTML=
"🔥 "+hot.join(" ")+" ❄ "+cold.join(" ")

document.getElementById("absence").innerHTML=
foods.map(f=>emoji[f]+" "+absence(f)).join(" | ")

document.getElementById("confidence").innerHTML=
(Math.random()*30+60).toFixed(1)+"%"

let monte=foods.map(f=>{
return (Math.random()*15+5).toFixed(1)
})

document.getElementById("monte").innerHTML=
foods.map((f,i)=>emoji[f]+" "+monte[i]+"%").join(" ")

let acc=predictions?((correct/predictions)*100).toFixed(1):0

document.getElementById("accuracy").innerHTML=
acc+"% ("+correct+"/"+predictions+")"

drawRadar(scores)

}

function drawRadar(scores){

let c=document.getElementById("radar")
let ctx=c.getContext("2d")

ctx.clearRect(0,0,250,250)

let center=125
let radius=80
let keys=Object.keys(scores)

for(let i=0;i<keys.length;i++){

let angle=(i/keys.length)*2*Math.PI
let value=scores[keys[i]]/10

let x=center+Math.cos(angle)*radius*value
let y=center+Math.sin(angle)*radius*value

ctx.beginPath()
ctx.moveTo(center,center)
ctx.lineTo(x,y)
ctx.strokeStyle="#22c55e"
ctx.stroke()

ctx.fillText(emoji[keys[i]],x,y)

}

}

update()

</script>

</body>
</html>
