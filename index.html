<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Greedy Cat MAX — OMEGA GOD AI</title><style>
body{font-family:Arial;background:#020617;color:white;text-align:center;padding:20px}
h1{color:#22c55e}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
button{padding:12px;font-size:22px;background:#1e293b;color:white;border:none;border-radius:8px;cursor:pointer}
.hot{background:#ef4444}
.section{margin-top:16px}
canvas{background:black;border-radius:10px}
</style></head>
<body><h1>Greedy Cat MAX — OMEGA GOD AI</h1><div class="grid"><button onclick="add('corn')">🌽</button>
<button onclick="add('tomato')">🍅</button>
<button onclick="add('carrot')">🥕</button>
<button onclick="add('pepper')">🫑</button>

<button onclick="add('fish')">🐟</button>
<button onclick="add('shrimp')">🦐</button>
<button onclick="add('cow')">🐄</button>
<button onclick="add('chicken')">🐔</button>

</div><div class="grid"><button class="hot" onclick="hot('corn')">HOT 🌽</button>
<button class="hot" onclick="hot('tomato')">HOT 🍅</button>
<button class="hot" onclick="hot('carrot')">HOT 🥕</button>
<button class="hot" onclick="hot('pepper')">HOT 🫑</button>

<button class="hot" onclick="hot('fish')">HOT 🐟</button>
<button class="hot" onclick="hot('shrimp')">HOT 🦐</button>
<button class="hot" onclick="hot('cow')">HOT 🐄</button>
<button class="hot" onclick="hot('chicken')">HOT 🐔</button>

</div><button onclick="undo()">Undo</button>
<button onclick="reset()">Reset</button>

<div class="section"><b>Last 20</b><div id="history"></div></div>
<div class="section"><b>Heatmap</b><div id="heatmap"></div></div>
<div class="section"><b>Absence</b><div id="absence"></div></div><div class="section"><b>Repeat</b><div id="repeat"></div></div>
<div class="section"><b>Follow</b><div id="follow"></div></div>
<div class="section"><b>Pair</b><div id="pair"></div></div>
<div class="section"><b>Triple</b><div id="triple"></div></div><div class="section"><b>Wave / Trap</b><div id="wave"></div></div>
<div class="section"><b>Bias</b><div id="bias"></div></div><div class="section"><b>Prediction</b><div id="prediction"></div></div>
<div class="section"><b>Top5</b><div id="top5"></div></div>
<div class="section"><b>Top6</b><div id="top6"></div></div><div class="section"><b>Strategy</b>
<div id="safe"></div>
<div id="balanced"></div>
<div id="aggressive"></div>
</div><div class="section"><b>Probability</b><div id="prob"></div></div>
<div class="section"><b>Monte Carlo</b><div id="monte"></div></div><div class="section">
<b>Radar</b>
<canvas id="radar" width="300" height="300"></canvas>
</div><div class="section"><b>Confidence</b><div id="confidence"></div></div>
<div class="section"><b>Accuracy</b><div id="accuracy"></div></div><script>

const foods=["corn","tomato","carrot","pepper","fish","shrimp","cow","chicken"]

const veg=["corn","tomato","carrot","pepper"]
const meat=["fish","shrimp","cow","chicken"]

const emoji={
corn:"🌽",tomato:"🍅",carrot:"🥕",pepper:"🫑",
fish:"🐟",shrimp:"🦐",cow:"🐄",chicken:"🐔"
}

let history=[]
let hotItem=null
let memory={}

let weights={}
foods.forEach(f=>weights[f]=1)

let predictions=0
let correct=0

function add(food){

if(window.lastPrediction){
predictions++
if(window.lastPrediction.includes(food)){
correct++
weights[food]+=0.2
}else{
window.lastPrediction.forEach(p=>weights[p]-=0.03)
}
}

history.push(food)

if(history.length>1000)history.shift()

patternMemory()
update()
}

function undo(){history.pop();update()}
function reset(){history=[];memory={};update()}
function hot(f){hotItem=f}

function absence(food){
for(let i=history.length-1;i>=0;i--){
if(history[i]==food)return history.length-i-1
}
return history.length
}

function repeat(){
if(!history.length)return ""
let last=history[history.length-1]
let c=1
for(let i=history.length-2;i>=0;i--){
if(history[i]==last)c++
else break
}
return emoji[last]+" x"+c
}

function patternMemory(){
for(let i=0;i<history.length-2;i++){
let key=history[i]+"-"+history[i+1]
let next=history[i+2]
if(!memory[key])memory[key]={}
memory[key][next]=(memory[key][next]||0)+1
}
}

function waveDetector(){
let last=history.slice(-10)
let v=last.filter(x=>veg.includes(x)).length
let m=last.filter(x=>meat.includes(x)).length
if(v>m)return "Vegetable Wave"
if(m>v)return "Meat Wave"
return "Mixed"
}

function trapDetector(){
let last=history.slice(-6)
let v=last.filter(x=>veg.includes(x)).length
let m=last.filter(x=>meat.includes(x)).length
if(v>=5)return "Vegetable Trap"
if(m>=5)return "Meat Trap"
return "Normal"
}

function aiScores(){

let scores={}
foods.forEach(f=>scores[f]=0)

history.forEach(f=>scores[f]+=weights[f])
foods.forEach(f=>scores[f]+=absence(f)*0.5)

if(history.length){
let last=history[history.length-1]
scores[last]+=3
}

if(hotItem)scores[hotItem]+=5

let last10=history.slice(-10)

foods.forEach(f=>{
let c=last10.filter(x=>x==f).length
if(c>=3)scores[f]+=1
if(c>=4)scores[f]+=2
})

foods.forEach(f=>scores[f]+=Math.random())

return scores
}

function monteCarlo(){

let sim={}
foods.forEach(f=>sim[f]=0)

for(let i=0;i<2000;i++){

let scores=aiScores()
let sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1])
let pick=sorted[Math.floor(Math.random()*4)][0]
sim[pick]++

}

foods.forEach(f=>sim[f]=(sim[f]/2000*100).toFixed(1))
return sim
}

function drawRadar(scores){

let canvas=document.getElementById("radar")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,300,300)

let center=150
let radius=100

let keys=Object.keys(scores)

keys.forEach((k,i)=>{

let angle=(i/keys.length)*2*Math.PI
let value=scores[k]/20

let x=center+Math.cos(angle)*radius*value
let y=center+Math.sin(angle)*radius*value

ctx.beginPath()
ctx.moveTo(center,center)
ctx.lineTo(x,y)
ctx.strokeStyle="#22c55e"
ctx.stroke()

ctx.fillText(emoji[k],x,y)

})
}

function update(){

let last20=history.slice(-20)

document.getElementById("history").innerHTML=
last20.map(x=>emoji[x]).join(" ")

document.getElementById("heatmap").innerHTML=
history.slice(-40).map(x=>emoji[x]).join(" ")

document.getElementById("absence").innerHTML=
foods.map(f=>emoji[f]+" "+absence(f)).join(" | ")

document.getElementById("repeat").innerHTML=repeat()

document.getElementById("wave").innerHTML=
waveDetector()+" | "+trapDetector()

let s=aiScores()

drawRadar(s)

let sorted=Object.entries(s).sort((a,b)=>b[1]-a[1])

let vegTop=sorted.filter(x=>veg.includes(x[0])).slice(0,3).map(x=>x[0])
let meatTop=sorted.filter(x=>meat.includes(x[0])).slice(0,2).map(x=>x[0])

let top5=[...vegTop,...meatTop]

let meat3=sorted.filter(x=>meat.includes(x[0])).slice(0,3).map(x=>x[0])

let top6=[vegTop[0],vegTop[1],vegTop[2],meat3[0],meat3[1],meat3[2]]

window.lastPrediction=top5

document.getElementById("prediction").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top5").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top6").innerHTML=
top6.map(x=>emoji[x]).join(" ")

document.getElementById("safe").innerHTML=
"SAFE: "+sorted.slice(0,5).map(x=>emoji[x[0]]).join(" ")

document.getElementById("balanced").innerHTML=
"BALANCED: "+sorted.slice(0,4).map(x=>emoji[x[0]]).join(" ")

document.getElementById("aggressive").innerHTML=
"AGGRESSIVE: "+sorted.slice(0,3).map(x=>emoji[x[0]]).join(" ")

let total=Object.values(s).reduce((a,b)=>a+b,0)

document.getElementById("prob").innerHTML=
foods.map(f=>emoji[f]+" "+((s[f]/total)*100).toFixed(1)+"%").join(" | ")

let monte=monteCarlo()

document.getElementById("monte").innerHTML=
foods.map(f=>emoji[f]+" "+monte[f]+"%").join(" | ")

let confidence=Math.max(...Object.values(s))

document.getElementById("confidence").innerHTML=
confidence.toFixed(1)

let acc=predictions?((correct/predictions)*100).toFixed(1):0

document.getElementById("accuracy").innerHTML=
acc+"%"

}

update()

</script></body>
</html>
