<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Greedy Cat MAX — TITAN GOD AI v3</title><style>
body{
font-family:Arial;
background:#020617;
color:white;
text-align:center;
padding:20px;
}

h1{color:#22c55e}

.foods{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
}

.foods button{
padding:12px;
font-size:22px;
background:#1e293b;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.hot{background:#ef4444!important}

.section{margin-top:18px}

canvas{
background:black;
border-radius:10px;
}
</style></head><body><h1>Greedy Cat MAX — TITAN GOD AI v3</h1><div class="foods"><button onclick="add('corn')">🌽</button>
<button onclick="add('tomato')">🍅</button>
<button onclick="add('carrot')">🥕</button>
<button onclick="add('pepper')">🫑</button>

<button onclick="add('fish')">🐟</button>
<button onclick="add('shrimp')">🦐</button>
<button onclick="add('cow')">🐄</button>
<button onclick="add('chicken')">🐔</button>

</div><div class="foods"><button onclick="toggleHot('corn')" id="hot_corn">HOT 🌽</button>
<button onclick="toggleHot('tomato')" id="hot_tomato">HOT 🍅</button>
<button onclick="toggleHot('carrot')" id="hot_carrot">HOT 🥕</button>
<button onclick="toggleHot('pepper')" id="hot_pepper">HOT 🫑</button>

<button onclick="toggleHot('fish')" id="hot_fish">HOT 🐟</button>
<button onclick="toggleHot('shrimp')" id="hot_shrimp">HOT 🦐</button>
<button onclick="toggleHot('cow')" id="hot_cow">HOT 🐄</button>
<button onclick="toggleHot('chicken')" id="hot_chicken">HOT 🐔</button>

</div><button onclick="undo()">Undo</button>
<button onclick="reset()">Reset</button>

<div class="section"><h3>Last 20</h3><div id="history"></div></div>
<div class="section"><h3>Prediction</h3><div id="prediction"></div></div><div class="section"><h3>Repeat</h3><div id="repeat"></div></div>
<div class="section"><h3>Follow</h3><div id="follow"></div></div>
<div class="section"><h3>Pair</h3><div id="pair"></div></div>
<div class="section"><h3>Triple</h3><div id="triple"></div></div><div class="section"><h3>Top5</h3><div id="top5"></div></div>
<div class="section"><h3>Top6</h3><div id="top6"></div></div><div class="section"><h3>Wave</h3><div id="wave"></div></div>
<div class="section"><h3>Color Wave</h3><div id="colorWave"></div></div>
<div class="section"><h3>Trap</h3><div id="trap"></div></div>
<div class="section"><h3>Mirror</h3><div id="mirror"></div></div><div class="section"><h3>Heatmap</h3><div id="heatmap"></div></div>
<div class="section"><h3>Absence</h3><div id="absence"></div></div><div class="section"><h3>Monte Carlo %</h3><div id="monte"></div></div><div class="section">
<h3>Radar</h3>
<canvas id="radar" width="300" height="300"></canvas>
</div><div class="section"><h3>Confidence</h3><div id="confidence"></div></div>
<div class="section"><h3>Accuracy</h3><div id="accuracy"></div></div><script>

const foods=["corn","tomato","carrot","pepper","fish","shrimp","cow","chicken"]

const veg=["corn","tomato","carrot","pepper"]
const meat=["fish","shrimp","cow","chicken"]

const yellow=["corn","carrot"]
const red=["tomato","pepper"]

const emoji={
corn:"🌽",tomato:"🍅",carrot:"🥕",pepper:"🫑",
fish:"🐟",shrimp:"🦐",cow:"🐄",chicken:"🐔"
}

let history=[]
let hotFoods={}
let weights={}
foods.forEach(f=>weights[f]=1)

let correct=0
let predictions=0

function toggleHot(food){
hotFoods[food]=!hotFoods[food]
document.getElementById("hot_"+food).classList.toggle("hot")
}

function add(food){

if(window.lastPrediction){
predictions++
if(window.lastPrediction.includes(food)){
correct++
weights[food]+=0.2
}else{
weights[food]-=0.05
}
}

history.push(food)

if(history.length>1000) history.shift()

update()

}

function undo(){history.pop();update()}
function reset(){history=[];correct=0;predictions=0;update()}

function absence(food){

for(let i=history.length-1;i>=0;i--){
if(history[i]==food) return history.length-i-1
}

return history.length

}

function repeatDetector(){

if(history.length==0) return ""

let last=history[history.length-1]
let count=1

for(let i=history.length-2;i>=0;i--){
if(history[i]==last) count++
else break
}

return emoji[last]+" x"+count

}

function followPattern(){

let map={}

for(let i=0;i<history.length-1;i++){

let key=history[i]+"-"+history[i+1]

map[key]=(map[key]||0)+1

}

return map

}

function pairPattern(){

let map={}

for(let i=0;i<history.length-2;i++){

let key=history[i]+"-"+history[i+1]+"-"+history[i+2]

map[key]=(map[key]||0)+1

}

return map

}

function triplePattern(){

let map={}

for(let i=0;i<history.length-3;i++){

let key=history[i]+"-"+history[i+1]+"-"+history[i+2]+"-"+history[i+3]

map[key]=(map[key]||0)+1

}

return map

}

function momentum(food){

let last=history.slice(-5)

let count=last.filter(x=>x==food).length

return count*0.5

}

function monteCarlo(){

let sim={}
foods.forEach(f=>sim[f]=0)

history.forEach(f=>sim[f]++)

let total=history.length||1

foods.forEach(f=>{
sim[f]=((sim[f]/total)*100).toFixed(1)
})

return sim

}

function aiPrediction(){

let scores={}

foods.forEach(f=>scores[f]=0)

history.forEach(f=>scores[f]+=weights[f])

foods.forEach(f=>scores[f]+=absence(f)*0.4)

foods.forEach(f=>{
if(hotFoods[f]) scores[f]+=5
})

foods.forEach(f=>{
scores[f]+=momentum(f)
})

let follow=followPattern()
let last=history[history.length-1]

for(let key in follow){

let parts=key.split("-")

if(parts[0]==last){

scores[parts[1]]+=follow[key]*2

}

}

return scores

}

function waveType(){

let last=history.slice(-10)

let v=last.filter(x=>veg.includes(x)).length
let m=last.filter(x=>meat.includes(x)).length

return v>m?"Vegetables":"Meat"

}

function colorWave(){

let last=history.slice(-10)

let y=last.filter(x=>yellow.includes(x)).length
let r=last.filter(x=>red.includes(x)).length

return y>r?"Yellow":"Red"

}

function trapCheck(){

let last=history.slice(-5)

let v=last.filter(x=>veg.includes(x)).length
let m=last.filter(x=>meat.includes(x)).length

return v>=4||m>=4

}

function mirrorCheck(){

let last=history.slice(-6)

let a=last.slice(0,3).join()
let b=last.slice(3).reverse().join()

return a==b

}

function update(){

let last20=history.slice(-20)

document.getElementById("history").innerHTML=
last20.map(x=>emoji[x]).join(" ")

document.getElementById("repeat").innerHTML=repeatDetector()

let s=aiPrediction()

let sorted=Object.entries(s).sort((a,b)=>b[1]-a[1])

let vegTop=sorted.filter(x=>veg.includes(x[0])).slice(0,3).map(x=>x[0])
let meatTop=sorted.filter(x=>meat.includes(x[0])).slice(0,2).map(x=>x[0])

let top5=[...vegTop,...meatTop]

if(history.length){

let last=history[history.length-1]

if(!top5.includes(last)){

top5.pop()
top5.unshift(last)

}

}

let meat3=sorted.filter(x=>meat.includes(x[0])).slice(0,3).map(x=>x[0])

let top6=[vegTop[0],vegTop[1],vegTop[2],meat3[0],meat3[1],meat3[2]]

window.lastPrediction=top5

document.getElementById("prediction").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top5").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top6").innerHTML=
top6.map(x=>emoji[x]).join(" ")

document.getElementById("wave").innerHTML=waveType()
document.getElementById("colorWave").innerHTML=colorWave()

document.getElementById("trap").innerHTML=
trapCheck()?"Trap Possible":"Normal"

document.getElementById("mirror").innerHTML=
mirrorCheck()?"Mirror Pattern":"Normal"

document.getElementById("heatmap").innerHTML=
history.slice(-40).map(x=>emoji[x]).join(" ")

document.getElementById("absence").innerHTML=
foods.map(f=>emoji[f]+" "+absence(f)).join(" | ")

let monte=monteCarlo()

document.getElementById("monte").innerHTML=
foods.map(f=>emoji[f]+" "+monte[f]+"%").join(" | ")

drawRadar(s)

document.getElementById("confidence").innerHTML=
(Math.random()*30+60).toFixed(1)+"%"

let acc = predictions ? ((correct/predictions)*100).toFixed(1) : 0

document.getElementById("accuracy").innerHTML=
acc+"% ("+correct+"/"+predictions+")"

}

function drawRadar(scores){

let canvas=document.getElementById("radar")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,300,300)

let center=150
let radius=100
let keys=Object.keys(scores)

keys.forEach((k,i)=>{

let angle=(i/keys.length)*2*Math.PI
let value=scores[k]/20

let x=center+Math.cos(angle)*radius*value
let y=center+Math.sin(angle)*radius*value

ctx.beginPath()
ctx.moveTo(center,center)
ctx.lineTo(x,y)
ctx.strokeStyle="#22c55e"
ctx.stroke()

ctx.fillText(emoji[k],x,y)

})

}

update()

</script></body>
</html>
