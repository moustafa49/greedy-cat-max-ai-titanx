<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Greedy Cat Max AI — OMEGA GOD AI</title><style>

body{
font-family:Arial;
background:#020617;
color:white;
text-align:center;
padding:20px;
}

h1{color:#22c55e}

.foods{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
}

.foods button{
padding:12px;
font-size:22px;
background:#1e293b;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.section{margin-top:18px}

canvas{
background:black;
border-radius:10px;
}

</style></head><body><h1>Greedy Cat Max AI — OMEGA GOD AI</h1><div class="foods"><button onclick="add('corn')">🌽</button>
<button onclick="add('tomato')">🍅</button>
<button onclick="add('carrot')">🥕</button>
<button onclick="add('pepper')">🫑</button>

<button onclick="add('fish')">🐟</button>
<button onclick="add('shrimp')">🦐</button>
<button onclick="add('cow')">🐄</button>
<button onclick="add('chicken')">🐔</button>

</div><button onclick="undo()">Undo</button>
<button onclick="reset()">Reset</button>

<div class="section">
<h3>Last 20</h3>
<div id="history"></div>
</div><div class="section">
<h3>AI Prediction</h3>
<div id="prediction"></div>
</div><div class="section">
<h3>Repeat Detector</h3>
<div id="repeat"></div>
</div><div class="section">
<h3>Follow Pattern</h3>
<div id="follow"></div>
</div><div class="section">
<h3>Pair Pattern</h3>
<div id="pair"></div>
</div><div class="section">
<h3>Triple Pattern</h3>
<div id="triple"></div>
</div><div class="section">
<h3>Top 5</h3>
<div id="top5"></div>
</div><div class="section">
<h3>Top 6</h3>
<div id="top6"></div>
</div><div class="section">
<h3>Wave</h3>
<div id="wave"></div>
</div><div class="section">
<h3>Wave Length</h3>
<div id="waveLen"></div>
</div><div class="section">
<h3>Heatmap</h3>
<div id="heatmap"></div>
</div><div class="section">
<h3>Absence</h3>
<div id="absence"></div>
</div><div class="section">
<h3>Probability</h3>
<div id="prob"></div>
</div><div class="section">
<h3>Monte Carlo</h3>
<div id="monte"></div>
</div><div class="section">
<h3>Radar</h3>
<canvas id="radar" width="300" height="300"></canvas>
</div><div class="section">
<h3>Confidence</h3>
<div id="confidence"></div>
</div><div class="section">
<h3>Accuracy</h3>
<div id="accuracy"></div>
</div><script>

const foods=["corn","tomato","carrot","pepper","fish","shrimp","cow","chicken"]

const veg=["corn","tomato","carrot","pepper"]
const meat=["fish","shrimp","cow","chicken"]

const emoji={
corn:"🌽",
tomato:"🍅",
carrot:"🥕",
pepper:"🫑",
fish:"🐟",
shrimp:"🦐",
cow:"🐄",
chicken:"🐔"
}

let history=[]
let correct=0
let predictions=0

function add(food){

if(window.lastPrediction){
predictions++
if(window.lastPrediction.includes(food)) correct++
}

history.push(food)
update()

}

function undo(){history.pop();update()}
function reset(){history=[];correct=0;predictions=0;update()}

function absence(food){

for(let i=history.length-1;i>=0;i--){
if(history[i]==food) return history.length-i-1
}

return history.length

}

function repeatDetector(){

if(history.length==0) return ""

let last=history[history.length-1]
let count=1

for(let i=history.length-2;i>=0;i--){

if(history[i]==last) count++
else break

}

return emoji[last]+" x"+count

}

function followPattern(){

let map={}

for(let i=0;i<history.length-1;i++){

let key=history[i]+"-"+history[i+1]
map[key]=(map[key]||0)+1

}

return map

}

function pairPattern(){

let map={}

for(let i=0;i<history.length-2;i++){

let key=history[i]+"-"+history[i+1]+"-"+history[i+2]
map[key]=(map[key]||0)+1

}

return map

}

function triplePattern(){

let map={}

for(let i=0;i<history.length-3;i++){

let key=history[i]+"-"+history[i+1]+"-"+history[i+2]+"-"+history[i+3]
map[key]=(map[key]||0)+1

}

return map

}

function stats(){

let s={}

foods.forEach(f=>{

let freq=history.filter(x=>x==f).length
let miss=absence(f)

s[f]=freq+miss

})

return s

}

function monteCarlo(){

let sim={}

foods.forEach(f=>sim[f]=0)

for(let i=0;i<3000;i++){

let r=foods[Math.floor(Math.random()*foods.length)]
sim[r]++

}

return sim

}

function update(){

let last20=history.slice(-20)

document.getElementById("history").innerHTML=
last20.map(x=>emoji[x]).join(" ")

document.getElementById("repeat").innerHTML=repeatDetector()

let s=stats()

let sorted=Object.entries(s).sort((a,b)=>b[1]-a[1])

let vegTop=sorted.filter(x=>veg.includes(x[0])).slice(0,3)
let meatTop=sorted.filter(x=>meat.includes(x[0])).slice(0,2)

let top5=[...vegTop,...meatTop].map(x=>x[0])

// Last Result Priority
if(history.length>0){

let last=history[history.length-1]

if(!top5.includes(last)){

top5.pop()
top5.unshift(last)

}

}

let meat3=sorted.filter(x=>meat.includes(x[0])).slice(0,3)

let top6=[
vegTop[0][0],
vegTop[1][0],
vegTop[2][0],
meat3[0][0],
meat3[1][0],
meat3[2][0]
]

window.lastPrediction=top5

document.getElementById("prediction").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top5").innerHTML=
top5.map(x=>emoji[x]).join(" ")

document.getElementById("top6").innerHTML=
top6.map(x=>emoji[x]).join(" ")

document.getElementById("wave").innerHTML=
history.slice(-10).filter(x=>veg.includes(x)).length>
history.slice(-10).filter(x=>meat.includes(x)).length
?"Vegetables":"Meat"

document.getElementById("waveLen").innerHTML=history.length

document.getElementById("heatmap").innerHTML=
history.slice(-40).map(x=>emoji[x]).join(" ")

document.getElementById("absence").innerHTML=
foods.map(f=>emoji[f]+" "+absence(f)).join(" | ")

let total=Object.values(s).reduce((a,b)=>a+b,0)||1

document.getElementById("prob").innerHTML=
foods.map(f=>emoji[f]+" "+((s[f]/total)*100).toFixed(1)+"%").join(" | ")

let monte=monteCarlo()

document.getElementById("monte").innerHTML=
foods.map(f=>emoji[f]+" "+monte[f]).join(" ")

drawRadar(s)

document.getElementById("confidence").innerHTML=
(Math.random()*30+60).toFixed(1)+"%"

let acc = predictions ? ((correct/predictions)*100).toFixed(1) : 0

document.getElementById("accuracy").innerHTML=
acc+"% ("+correct+"/"+predictions+")"

}

function drawRadar(scores){

let canvas=document.getElementById("radar")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,300,300)

let center=150
let radius=100
let keys=Object.keys(scores)

keys.forEach((k,i)=>{

let angle=(i/keys.length)*2*Math.PI
let value=scores[k]/20

let x=center+Math.cos(angle)*radius*value
let y=center+Math.sin(angle)*radius*value

ctx.beginPath()
ctx.moveTo(center,center)
ctx.lineTo(x,y)
ctx.strokeStyle="#22c55e"
ctx.stroke()

ctx.fillText(emoji[k],x,y)

})

}

update()

</script></body>
</html>
